<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MOON</title>

    <style>
        body{
            margin:0;
            color:white;
            font-family:Arial, sans-serif;
        }

        #space{
            height:100vh;
            min-height:600px;
            position:relative;
            overflow:hidden;
            background:#17416d;
        }

        #control{
            position:absolute;
            top:30px;
            left:30px;
            z-index:3;
            padding:10px 20px;
            background:rgba(0, 0, 0, 0.35);
        }

        #control p{
            margin:10px 0;
        }

        input{
            width:200px;
        }

        /* 북반구의 반원 궤적 */
        #circle{
            width:90vw;
            height:45vw;
            border:2px dashed rgba(255, 255, 255, 0.5);
            border-bottom:0;
            border-radius:50% 50% 0 0 / 100% 100% 0 0;
            position:absolute;
            left:50%;
            bottom:20vh;
            transform:translateX(-50%);
            z-index:1;
        }

        #moonmove{
            width:50%;
            height:1px;
            position:absolute;
            left:50%;
            top:100%;
            transform-origin:0 0;
        }

        #moon{
            width:130px;
            position:absolute;
            right:-65px;
            top:-65px;
        }

        #ground{
            width:100%;
            height:9vh;
            min-height:55px;
            background:#278e39;
            position:absolute;
            bottom:0;
            z-index:2;
        }

        #hill1, #hill2, #hill3, #hill4{
            position:absolute;
            bottom:3vh;
            border-radius:50% 50% 0 0;
            z-index:2;
        }

        #hill1{
            left:-8%;
            width:40%;
            height:120px;
            background:#37a643;
        }

        #hill2{
            left:19%;
            width:35%;
            height:160px;
            background:#4dbb4c;
        }

        #hill3{
            left:48%;
            width:38%;
            height:135px;
            background:#35a641;
        }

        #hill4{
            left:75%;
            width:35%;
            height:105px;
            background:#54b94b;
        }
    </style>
</head>

<body>
    <div id="space">
        <div id="control">
            <p>DATE</p>
            <p id="date">15일</p>
            <input type="range" id="day1" min="1" max="31" value="15">

            <p>TIME</p>
            <p id="time">6시</p>
            <input type="range" id="hour1" min="6" max="18" value="6">
        </div>

        <div id="circle">
            <div id="moonmove">
                <img id="moon" src="images/moon5.png" alt="달">
            </div>
        </div>

        <div id="hill1"></div>
        <div id="hill2"></div>
        <div id="hill3"></div>
        <div id="hill4"></div>
        <div id="ground"></div>
    </div>

    <script>
        day1.oninput = function(){
            date.innerHTML = day1.value + "일";

            if(day1.value <= 3){
                moon.src = "images/moon1.png";
            }
            else if(day1.value <= 7){
                moon.src = "images/moon2.png";
            }
            else if(day1.value <= 10){
                moon.src = "images/moon3.png";
            }
            else if(day1.value <= 14){
                moon.src = "images/moon4.png";
            }
            else if(day1.value <= 17){
                moon.src = "images/moon5.png";
            }
            else if(day1.value <= 21){
                moon.src = "images/moon6.png";
            }
            else if(day1.value <= 25){
                moon.src = "images/moon7.png";
            }
            else{
                moon.src = "images/moon8.png";
            }
        }

        hour1.oninput = function(){
            time.innerHTML = hour1.value + "시";

            let angle = 180 + (hour1.value - 6) * 15;
            moonmove.style.transform = "rotate(" + angle + "deg)";
            moon.style.transform = "rotate(" + (-angle) + "deg)";

            let brightness;
            if(hour1.value <= 12){
                brightness = 8 + (hour1.value - 6) * 8;
            }
            else{
                brightness = 8 + (18 - hour1.value) * 8;
            }
            space.style.background = "hsl(207, 76%, " + brightness + "%)";
        }

        day1.oninput();
        hour1.oninput();
    </script>
</body>
</html>
